<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devil's Advocate Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>😈 Devil's Advocate Bot</h1>
            <p>Give an opinion. I'll argue the opposite. Always.</p>
            <button id="resetBtn">Reset Chat</button>
        </header>

        <div id="chatBox" class="chat-box">
            <div class="message bot-message">
                Say something you believe in — I dare you. I'll argue the other side. 😈
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            Devil's Advocate is thinking...
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your opinion here..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const resetBtn = document.getElementById("resetBtn");
        const loading = document.getElementById("loading");

        // Simple session id so multiple browser tabs don't mix history
        const sessionId = "session_" + Math.random().toString(36).substring(2);

        function addMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = "message " + (sender === "user" ? "user-message" : "bot-message");
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, "user");
            userInput.value = "";
            sendBtn.disabled = true;
            loading.style.display = "block";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message, session_id: sessionId })
                });

                const data = await response.json();

                if (data.error) {
                    addMessage("⚠️ Error: " + data.error, "bot");
                } else {
                    addMessage(data.reply, "bot");
                }
            } catch (err) {
                addMessage("⚠️ Network error. Is the Flask server running?", "bot");
                console.error(err);
            } finally {
                loading.style.display = "none";
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", function (e) {
            if (e.key === "Enter") sendMessage();
        });

        resetBtn.addEventListener("click", async function () {
            await fetch("/reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId })
            });
            chatBox.innerHTML = '<div class="message bot-message">Chat reset. Say something you believe in — I dare you. 😈</div>';
        });
    </script>
</body>
</html>
